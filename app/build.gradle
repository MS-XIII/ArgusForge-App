plugins {
    id 'com.android.application'
}

android {
    namespace 'com.argusforge.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.argusforge.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The UI is served from assets/ as a WebView hybrid; keep the APK lean.
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

// Zero third-party runtime dependencies: pure Android SDK (WebView + HttpURLConnection).
dependencies {
}
